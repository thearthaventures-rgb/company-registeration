<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Generated by npm run build — do not edit directly.
       Source of truth: templates/page.html + src/components/* -->
  <title>%%TITLE%%</title>
  <meta name="description" content="%%DESCRIPTION%%">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="%%PAGE_URL%%">
  <meta name="theme-color" content="%%THEME_COLOR%%">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ArthoVista">
  <meta property="og:title" content="%%TITLE%%">
  <meta property="og:description" content="%%DESCRIPTION%%">
  <meta property="og:url" content="%%PAGE_URL%%">
  <meta property="og:image" content="%%OG_IMAGE%%">
  <meta property="og:locale" content="%%LOCALE%%">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="%%TITLE%%">
  <meta name="twitter:description" content="%%DESCRIPTION%%">
  <meta name="twitter:image" content="%%OG_IMAGE%%">

  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="preload" as="image" href="/assets/logo.svg" fetchpriority="high">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles.css">

  %%ANALYTICS_HEAD%%
  %%JSONLD%%
</head>
<body>
  [[header]]

  <main id="main">
    [[hero]]
    [[stats]]
    [[about]]
    [[ecosystem]]
    [[capital]]
    [[foundations]]
    [[methodology]]
    [[sectors]]
    [[pillars]]
    [[services]]
    [[faq]]
    [[leadform]]
  </main>

  [[footer]]
  [[floating-cta]]

  <script src="/app.js" defer></script>
</body>
</html>
